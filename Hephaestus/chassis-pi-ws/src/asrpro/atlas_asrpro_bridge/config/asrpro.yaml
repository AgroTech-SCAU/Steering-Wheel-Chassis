atlas_asrpro_bridge:
  ros__parameters:
    # 使用 udev 固定后的 ASRPRO 串口名称；不要在正式比赛中直接使用 ttyUSB 序号
    port: "/dev/atlas_asrpro"

    # ASRPRO 与树莓派两端必须完全一致
    baudrate: 115200

    # 串口断开后的重连周期
    reconnect_interval_s: 1.0

    # 串口单次读取超时
    read_timeout_s: 0.05

    # 超过该时间未收到任何有效帧时重新连接
    device_timeout_s: 3.0

    # 树莓派主动发送 PING 的周期
    heartbeat_period_s: 1.0

    # 下行命令等待 ACK 的时间
    ack_timeout_s: 0.30

    # ACK 超时后的重复发送次数；ASRPRO 必须按 sequence 去重
    command_retry_count: 3

    # 单行协议帧最大字节数
    max_line_length: 256

    # 当前协议版本
    protocol_version: 1

    # 收到 HELLO 后自动打开识别监听
    auto_enable_listen: true

    # ROS 状态发布频率
    status_rate_hz: 5.0

    status_topic: "/atlas/asrpro/status"
    event_topic: "/atlas/asrpro/event"
    recognized_topic: "/atlas/asrpro/recognized"
    speak_service: "/atlas/asrpro/speak"
