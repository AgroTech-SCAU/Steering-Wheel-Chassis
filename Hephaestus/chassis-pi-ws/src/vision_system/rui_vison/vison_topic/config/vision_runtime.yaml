vision_runtime:
  paths:
    # 留空时使用 vison_topic 功能包 resource/best.onnx
    # 正式比赛可填写绝对路径；例如 /home/wheeltec/atlas_models/best.onnx
    model_path: ""

    # 留空时自动查找 best.labels.txt 或 labels.txt；找不到时使用代码内类别表
    labels_path: ""

  camera:
    # 推荐使用 udev 固定名称；也可以填写数字索引 0
    device: "/dev/atlas_camera"
    width: 640
    height: 640
    fps: 30

  yolo:
    conf_threshold: 0.55
    class_names: ["luosi", "chilun"]

  service:
    name: "vision_detect"
    topic_name: "vision_detections"
    rate_hz: 10

  optimization:
    onnx_threads: 2
    process_every_n: 2
    publish_rate_hz: 0

  display:
    show_preview: false
    print_coords: false
