# Atlas 智械争锋全自主运输区统一配置
#
# 本文件同时作为整车启动入口和状态机任务配置；模型路径；串口配置；导航配置；视觉适配配置；机械臂动作配置都从这里集中引用
# calibration_confirmed=false 时状态机只完成通信和状态检查；不会产生导航或机械臂运动命令

system:
  startup:
    # 启动顺序为 ASRPRO 与 MCU；传感器；导航；视觉；机械臂后端；任务状态机
    # 延时用于等待设备节点建立；状态机内部仍会继续检查实际服务和状态；不会只依赖固定延时
    asrpro_delay_s: 0.0
    mcu_delay_s: 0.0
    sensor_delay_s: 1.0
    navigation_delay_s: 2.0
    vision_delay_s: 3.0
    manipulation_delay_s: 4.0
    manager_delay_s: 6.0

  launch:
    navigation_backend: "full"
    manipulation_backend: "racom_vision"
    navigation_cmd_vel_topic: "/atlas/navigation/cmd_vel"

    # true 时启动激光雷达；机器人描述；Cartographer 纯定位和 Nav2
    enable_lidar: true
    enable_robot_description: true
    enable_navigation: true

    # true 时启动最新 vision_system 中的 ONNX 检测节点和 Atlas 视觉适配节点
    enable_vision: true

  paths:
    # 留空表示使用对应功能包安装目录中的默认文件
    # 也可以填写绝对路径；相对路径按本 YAML 所在目录解析
    mcu_config: ""
    asrpro_config: ""
    nav2_params: ""
    map_yaml: ""
    cartographer_pbstream: ""
    full_nav_config: ""
    pseudo_nav_config: ""

    # 视觉运行配置；模型路径；类别文件路径都在此处集中配置
    # vision_model_path 留空时使用最新 vision_system 内置的 resource/best.onnx
    vision_runtime_config: ""
    vision_model_path: ""
    vision_labels_path: ""
    racom_camera_config: ""
    sorting_rule_config: ""

    manipulation_config: ""
    transport_actions: ""

  vision:
    # 建议通过 udev 固定为 /dev/atlas_camera；不要在正式比赛中依赖 /dev/video0 序号
    camera: "/dev/atlas_camera"
    confidence_threshold: 0.55
    process_every_n: 2
    rate_hz: 10.0
    service_name: "vision_detect"
    topic_name: "vision_detections"

  runtime:
    # 节点异常退出后由 launch 自动重启；安全门控仍以 MCU 状态和 AutoPi 锁存为准
    respawn_nodes: true
    respawn_delay_s: 2.0

autonomous_transport:
  # 完成地图点；机械臂动作；视觉外参；相机视角和串口联调后改为 true
  calibration_confirmed: false

  timing:
    # 从 MCU AutoPi 启动事件确认后开始计时；包含播报和语音等待
    max_autonomous_duration_s: 300.0

    # 剩余时间不足且当前没有持货时；不再发起下一轮抓取
    stop_reserve_s: 20.0
    manipulation_timeout_s: 60.0
    classification_timeout_s: 20.0

  classification:
    minimum_confidence: 0.60

    # 赛事分类标识由裁判赛前摆放；默认禁止在识别失败后猜测园区映射
    # 开启后必须先人工确认 fallback_mapping 与当前赛场摆放一致
    use_fallback_mapping_on_failure: false
    fallback_mapping:
      park_1: "gear"
      park_2: "t_bolt"

  voice:
    # MCU 进入 AutoPi 后先让 ASRPRO 播报；随后等待 ASRPRO 识别 atlas_start
    start_required: true

    # 0 表示无限等待触发词；等待期间底盘保持制动；机械臂不动作
    start_timeout_s: 0.0
    fallback_enabled: false

    asrpro_status_timeout_s: 2.0
    speech_timeout_s: 8.0
    speech_retry_count: 2

    # ASRPRO 只向树莓派上报稳定 intent；不要直接上报中文原句
    accepted_intents:
      - "atlas_start"

    # phrase_id 必须与 ASRPRO 工程中的离线播报资源完全一致
    phrase_ids:
      transition_complete: "transition_complete"
      voice_prompt: "voice_prompt"
      autonomous_start: "autonomous_start"
      delivery_complete: "delivery_complete"
      task_complete: "task_complete"
      task_skipped: "task_skipped"

  cargo:
    # 待派送区共 8 个货物；齿轮和 T 型螺栓各 4 个
    target_total: 8
    expected_counts:
      gear: 4
      t_bolt: 4

    # 交替选择两类货物；单类暂时遮挡时不会持续阻塞同一类别
    plan:
      - "gear"
      - "t_bolt"
      - "gear"
      - "t_bolt"
      - "gear"
      - "t_bolt"
      - "gear"
      - "t_bolt"

    no_target_limit_per_class: 2

  recovery:
    # 普通阶段错误先重试；达到上限后记录并跳过；不会把状态机永久卡在当前阶段
    navigation_retry_count: 1
    classification_retry_count: 2
    pick_retry_count: 1
    continue_on_pick_failure: true

  waypoints:
    # 全部使用 map 绝对坐标；yaw 单位 rad；必须在实际赛场重新标定
    sorting_area:
      id: "autonomous_sorting_area"
      x_m: 0.0
      y_m: 0.0
      yaw_rad: 0.0
      timeout_s: 25.0

    dispatch_area:
      id: "autonomous_dispatch_area"
      x_m: 0.0
      y_m: 0.0
      yaw_rad: 0.0
      timeout_s: 25.0

    park_1:
      id: "autonomous_park_1"
      x_m: 0.0
      y_m: 0.0
      yaw_rad: 0.0
      timeout_s: 25.0

    park_2:
      id: "autonomous_park_2"
      x_m: 0.0
      y_m: 0.0
      yaw_rad: 0.0
      timeout_s: 25.0

  manipulation:
    # 导航前收臂；智能分拣观察；待派送区抓取；园区投放都由 transport_actions.yaml 定义
    safe_prepare_action: "transport_arm_safe"
    sorting_prepare_action: "sorting_scan_prepare"

    pick_prepare_actions:
      gear: "dispatch_pick_prepare"
      t_bolt: "dispatch_pick_prepare"

    pick_tasks:
      gear: "pick_one_gear"
      t_bolt: "pick_one_t_bolt"

    place_prepare_actions:
      park_1: "park_1_drop_prepare"
      park_2: "park_2_drop_prepare"

    place_tasks:
      park_1:
        - "place_park_1_slot_1"
        - "place_park_1_slot_2"
        - "place_park_1_slot_3"
        - "place_park_1_slot_4"
      park_2:
        - "place_park_2_slot_1"
        - "place_park_2_slot_2"
        - "place_park_2_slot_3"
        - "place_park_2_slot_4"
