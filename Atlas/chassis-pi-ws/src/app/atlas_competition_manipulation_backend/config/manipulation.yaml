atlas_competition_manipulation_backend:
  ros__parameters:
    backend_name: "vision_arm"

    start_service: "/atlas/manipulation/start"
    cancel_service: "/atlas/manipulation/cancel"
    status_topic: "/atlas/manipulation/status"

    initial_pose_service: "/move_to_initial_pose"
    initial_pose_ready_topic: "/initial_pose_ready"
    pick_target_topic: "/pick_target"
    arm_pose_topic: "/arm/pose"
    arm_joint_state_topic: "/arm/joint_states"
    arm_joints_service: "/mcu/set_arm_joints"
    arm_position_service: "/mcu/set_arm_position"
    suction_service: "/mcu/set_suction"

    # 低层服务应尽快确认收件；到位等待单独计算，适配慢速抬臂。
    service_timeout_s: 5.0
    motion_timeout_s: 30.0
    initial_pose_timeout_s: 15.0
    position_tolerance_m: 0.015
    stable_delta_m: 0.004
    stable_samples: 5

    # 抓取直接复用 handeye_bridge/screw_pick 已实机验证链路。
    # 本节点只发布 corner+layer，不覆盖 bridge 的平面高度、姿态和 target_z_offset。
    min_pick_target_motion_m: 0.005
    pick_target_settle_s: 0.25
    pick_lift_m: 0.050
    pick_bridge:
      motion_start_timeout_s: 2.0
      timeout_s: 10.0
    # bridge 到达接触位后开启吸盘并等待真空建立，再仅用 3D position IK 抬升。
    pick_suction_hold_s: 1.50
    # 放置释放后的静置时间，和抓取保持时间分开配置
    suction_settle_s: 0.45
    default_speed_rad_s: 0.8
    joint_tolerance_rad: 0.06
    pose_validation_tolerance_m: 0.08

    # 到位后静置时间：机械臂完全静止后再开始视觉检测，避免"还没稳定就开"
    settle_before_observe_s: 0.5

    # 视觉恢复的机械臂换视角；识别失败时按 offsets_m 逐次做小范围自检
    # offsets_m 为扁平 (dx,dy,dz) 三元组序列：上 / 右 / 后，逐次尝试
    # 未提供 offsets_m 时回退到 dx_m/dy_m/dz_m 固定偏移
    view_scan:
      enabled: true
      offsets_m: [0.0, 0.0, 0.02,  0.0, 0.03, 0.0,  -0.03, 0.0, 0.0]
      dx_m: 0.0
      dy_m: 0.025
      dz_m: 0.0

    # 智能分拣区只看到一个分类标志时，不再大范围改 XYZ，
    # 而是按画面左右只微调底座 joint1(q0)，再重新识别
    sorting_scan:
      # 每次约 4°，最多约 8°；保持在 handeye_bridge 视觉观察位容差附近
      joint1_step_rad: 0.07
      joint1_max_offset_rad: 0.14
      joint1_settle_s: 0.35
      # 实机“向右转”若与 +joint1 相反，只需改为 -1.0，不改代码
      joint1_right_sign: 1.0

    # 园区放置基准点由 competition.yaml 的 arm_motion.arenas.* 提供
    placement:
      enabled: false
      approach_m: 0.060
      layer_step_m: 0.050
      # 四个园区槽位相对 park base 的 xy 偏移: [x0,y0,x1,y1,x2,y2,x3,y3]
      slot_offsets_xy_m: [0.0, 0.0, 0.05, 0.0, 0.05, 0.05, 0.0, 0.05]
