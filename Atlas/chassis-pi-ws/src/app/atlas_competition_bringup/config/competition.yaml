# Atlas 智械争锋顶层比赛配置
# 未完成实测的机械臂关键位姿保持 configured=false
# 固定关键位姿优先按 joints_rad 执行 末端位姿用于标定复核

competition:
  backend_name: direct_odom_competition

  vision:
    # A/B 区均：画面左侧=园区一，右侧=园区二
    sorting_rule:
      enabled: true

    class_aliases:
      chilun: gear
      luosi: t_bolt

  # 比赛抓取参数；桥节点通用参数保留在 handeye_bridge/config/bridge_node.yaml。
  handeye_bridge:
    # ── 深度模式 ──
    # "manual": 使用 planeX_z_m 固定高度 (默认, 兼容旧配置)
    #            射线-平面求交: 像素反投影射线 ∩ Z=plane_z 平面 → (x,y)
    # "pnp":    用 4 个检测角点 + 已知物理间距做 PnP 求解实际深度
    #            自动算出目标在相机坐标系下的真实 3D 位置
    #            ⚠️ 需要 pnp_target_width_m / pnp_target_height_m 与实际螺丝间距一致
    depth_mode: "manual"
    # PnP 模式参数 (仅 depth_mode="pnp" 时生效)
    # 4 个螺丝/角点围成矩形的物理尺寸 (单位米)
    #    TL(0) ──── TR(1)
    #     │           │
    #    BL(3) ──── BR(2)
    # 测量方法: 卡尺量 TL→TR 的水平中心距 = width, TL→BL 的垂直中心距 = height
    pnp_target_width_m: 0.05      # ← 改! 实测螺丝间距 (都是5cm)
    pnp_target_height_m: 0.05     # ← 改! 实测螺丝间距 (都是5cm)
    # PnP 质量门禁
    pnp_max_reprojection_px: 2.0  # 重投影误差超过此值拒绝
    pnp_min_depth_m: 0.05         # 最小合理深度 (太近可能误检)
    pnp_max_depth_m: 0.80         # 最大合理深度 (太远 PnP 不可靠)

    # ── 运动参数 ──
    # 机械臂移动速度 (rad/s)
    # 与 MCU 遥控器机械臂高速档 servo_speed_rad_s 一致
    default_speed_rad_s: 50.24
    # 末端在目标上方偏移 (避免碰撞)
    target_z_offset_m: 0.003

    # ── 同步与标定安全门禁 ──
    expected_image_width: 640
    expected_image_height: 480
    max_detection_age_s: 0.5
    # 停止检测后重发的最佳帧，在接收后多少秒内允许选择
    final_best_valid_s: 60.0
    max_pose_sync_dt_ms: 80.0
    pose_history_size: 200
    # 保存实时检测帧与其原始机械臂位姿，供停止后的最佳帧复用
    detection_pose_cache_size: 2000
    min_handeye_inliers: 6
    max_handeye_translation_m: 0.50
    # true: 手眼结果必须包含采集时内参，且与运行时内参逐项一致
    require_intrinsics_binding: true

    # ── 手动偏置 (补偿系统误差，标定后微调用) ──
    # 正值=基座坐标系正方向；通常只调 X/Y，不动 Z
    manual_offset_x_m: -0.055
    manual_offset_y_m: 0.000
    manual_offset_z_m: 0.000

    # ── 行为 ──
    # 收到 /pick_target 后是否自动发送目标给机械臂 (false 则仅打印日志)
    # 默认仅计算和打印。完成新标定、平面实测和空载验证后再手动改为 true
    auto_send: true

  # 地图要求：导航组必须在中转区最优位姿/朝向开始建图，该位姿定义地图原点
  # 同一底盘基准位姿也用于机械臂 sorting_scan_a / sorting_scan_b 标定
  navigation:
    coordinate_mode: absolute_map
    action_name: navigate_to_pose
    action_server_timeout_s: 10.0
    stack_ready_timeout_s: 30.0

    # 全自主任务开头先做绝对对齐，随后保持激光定位持续校正里程计
    # A/B 地图都必须以中转区最优位姿/朝向作为 (0,0,0)；若 A/B 指向同一地图会自动去重
    startup_localization:
      warmup_s: 1.0
      candidate_timeout_s: 30.0
      sample_count: 20
      # 与保存的 map 图片核对激光命中点，避免把本次启动位置误认为地图原点
      min_map_scan_agreement: 0.35
      min_map_scan_hits: 25
      max_origin_offset_m: 1000.0
      max_origin_yaw_rad: 3.141593
      stability_xy_m: 0.030
      stability_yaw_rad: 0.040

    # 开局完成全局匹配后保留 Cartographer 激光定位，持续校正 MCU /odom 漂移；
    # 控制器仍为轻量直达，不经过 Nav2/DWB。
    continuous_localization:
      enabled: true
      tf_timeout_s: 0.50
      max_correction_speed_m_s: 0.30
      max_correction_yaw_rate_rad_s: 0.60
      max_tf_jump_m: 0.50
      max_tf_jump_yaw_rad: 0.70

    direct_control:
      kp_xy: 1.80
      kp_yaw: 2.20
      max_linear_speed_m_s: 1.00
      # 与 MCU 遥控器底盘中速档一致：1.0 m/s, 4.0 rad/s
      max_angular_speed_rad_s: 4.00
      max_linear_accel_m_s2: 2.00
      max_angular_accel_rad_s2: 8.00
      slowdown_distance_m: 0.20
      position_tolerance_m: 0.025
      yaw_tolerance_rad: 0.060
      require_yaw_reached: true
      brake_hold_s: 0.20

    arenas:
      A:
        map: maps/ruikang_a_map/ruikang.yaml
