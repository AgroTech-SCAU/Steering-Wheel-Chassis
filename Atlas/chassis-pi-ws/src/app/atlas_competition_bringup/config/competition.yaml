# Atlas 智械争锋顶层比赛配置
# 未完成实测的机械臂关键位姿保持 configured=false
# 固定关键位姿优先按 joints_rad 执行 末端位姿用于标定复核

competition:
  backend_name: direct_odom_competition

  vision:
    # A 区：画面左侧=园区二，右侧=园区一；B 区：左侧=园区一，右侧=园区二
    sorting_rule:
      enabled: true

    class_aliases:
      chilun: gear
      luosi: t_bolt

  # 地图要求：导航组必须在中转区最优位姿/朝向开始建图，该位姿定义地图原点
  # 同一底盘基准位姿也用于机械臂 sorting_scan_a / sorting_scan_b 标定
  navigation:
    coordinate_mode: absolute_map
    action_name: navigate_to_pose
    action_server_timeout_s: 10.0
    stack_ready_timeout_s: 30.0

    # 激光只在全自主任务开头做一次绝对对齐；允许从地图任意位置返回原点
    # A/B 地图都必须以中转区最优位姿/朝向作为 (0,0,0)；若 A/B 指向同一地图会自动去重
    startup_localization:
      warmup_s: 1.0
      candidate_timeout_s: 30.0
      sample_count: 20
      # 与保存的 map 图片核对激光命中点，避免把本次启动位置误认为地图原点
      min_map_scan_agreement: 0.35
      min_map_scan_hits: 25
      max_origin_offset_m: 1000.0
      max_origin_yaw_rad: 3.141593
      stability_xy_m: 0.030
      stability_yaw_rad: 0.040

    # 定位冻结后，所有底盘点位仅靠 MCU 融合 /odom 直达，不再使用 Nav2/DWB 控制
    direct_control:
      kp_xy: 1.20
      kp_yaw: 1.50
      max_linear_speed_m_s: 0.45
      max_angular_speed_rad_s: 0.60
      max_linear_accel_m_s2: 0.50
      max_angular_accel_rad_s2: 1.00
      slowdown_distance_m: 0.30
      position_tolerance_m: 0.025
      yaw_tolerance_rad: 0.060
      require_yaw_reached: true
      brake_hold_s: 0.30

    arenas:
      A:
        map: maps/test/ruikang.yaml
        pbstream: maps/test/ruikang.pbstream
        waypoints:
          pickup:
            x: 1.289458
            y: 0.071087
            yaw: 0.149729088
            configured: true
          park_1:
            x: 0.605981
            y: -0.388758
            yaw: 0.01298434
            configured: true
          park_2:
            x: 0.579779
            y: 0.493262
            yaw: 0.02811168
            configured: true




      B:
        # 临时复用 A 半场 正式比赛前必须替换
        map: "maps/test/ruikang.yaml"
        pbstream: "maps/test/ruikang.pbstream"
        waypoints:
          pickup: {x: 1.19, y: 0.14, yaw: 0.0, configured: true}
          park_1: {x: 0.70, y: -0.38, yaw: -2.133260731, configured: true}
          park_2: {x: 0.53, y: 0.48, yaw: 0.998693443, configured: true}

