mission:
  navigation_backend: direct_odom_competition
  manipulation_backend: vision_arm

  # A/B 半图和实际坐标由导航后端维护；YASMIN 只使用语义点位
  waypoints:
    # 先由视觉判定 A/B，再只加载对应地图做激光绝对对齐；若切自动时偏离中转区最优位姿，则用 odom 直达回到原点
    origin:
      id: origin
      timeout_s: 120.0
    pickup:
      id: pickup
      timeout_s: 30.0
    park_1:
      id: park_1
      timeout_s: 30.0
    park_2:
      id: park_2
      timeout_s: 30.0
