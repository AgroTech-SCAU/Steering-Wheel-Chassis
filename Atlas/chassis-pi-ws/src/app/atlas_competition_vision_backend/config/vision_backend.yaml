atlas_competition_vision_backend:
  ros__parameters:
    service_timeout_s: 3.0
    sorting_scan_timeout_s: 40.0
    vision_pose_ready_timeout_s: 8.0
    # 观察位就绪后再静置，采集足够的新帧供检测器选最佳帧。
    pose_settle_s: 0.3
    detection_window_s: 1.5
    final_centers_wait_s: 0.5
    # 智能分拣区只看到一个标志时，根据其画面位置微调 joint1 后重试。
    # 中心/右侧 -> 向右；左侧 -> 向左。
    sorting_reframe_attempts: 2
    sorting_image_center_u_px: 320.0

    topics:
      vision_pose_ready: "/vision_pose_ready"
      detection_centers: "/detection_centers"

    services:
      classify_sorting: "/atlas/vision/classify_sorting_rule"
      detect_target: "/atlas/vision/detect_target"
      vision_detect: "/vision_detect"
      move_to_sorting_scan_a: "/atlas/manipulation/move_to_sorting_scan_a"
      move_to_sorting_scan_b: "/atlas/manipulation/move_to_sorting_scan_b"
      adjust_sorting_scan_left: "/atlas/manipulation/adjust_sorting_scan_left"
      adjust_sorting_scan_right: "/atlas/manipulation/adjust_sorting_scan_right"

    class_aliases:
      chilun: gear
      luosi: t_bolt

    # Standalone default remains disabled; competition.yaml can enable it.
    # A/B 均：smaller image u = park_1，larger image u = park_2。
    sorting_rule:
      enabled: false
