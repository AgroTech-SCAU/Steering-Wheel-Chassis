atlas_autonomous_task:
  ros__parameters:
    # MCU 端事件与状态
    mcu_status_topic: "/mcu/status"
    auto_task_event_topic: "/mcu/auto_task_event"
    mission_result_service: "/mcu/report_mission_result"

    # 完整导航只通过 send_navigation_target 调用
    navigate_service: "/navigate_to_target"
    navigate_timeout_s: 300.0

    # rui_vison/ 的检测服务，包名仍保持原有拼写 vison_topic
    vision_service: "/vision_detect"
    vision_scan_duration_s: 2.0
    vision_service_timeout_s: 5.0
    gear_class_names: ["chilun", "gear"]
    bolt_class_names: ["luosi", "bolt", "t_bolt"]
    fallback_zone: "zone_1"

    # ASRPRO TWEN51 串口，先使用现有配置，不在这里强制绑定串口
    asrpro_port: "/dev/ttyUSB0"
    asrpro_baud: 115200
    asrpro_timeout_s: 0.02
    asrpro_handshake_timeout_s: 3.0
    asr_start_timeout_s: -1.0
    speak_timeout_s: 8.0

    # ASRPRO 固件内置 phrase_id
    phrase_transition_complete: "transition_complete"
    phrase_voice_prompt: "voice_prompt"
    phrase_autonomous_start: "autonomous_start"
    phrase_delivery_complete: "delivery_complete"
    phrase_task_complete: "task_complete"
    phrase_task_skipped: "task_skipped"

    # 智械争锋全自主运输航点
    waypoint_sort: "P1"
    waypoint_pickup: "P2"
    waypoint_zone_1: "P3"
    waypoint_zone_2: "P4"

    # 阶段失败策略
    skip_failed_stage: true
    report_fail_on_fatal_error: false
