atlas_nav_direct_backend:
  ros__parameters:
    backend_name: direct_odom_competition
    competition_config: ""
    odom_topic: /odom
    cmd_vel_topic: /atlas/navigation/cmd_vel
    status_topic: /atlas/navigation/status
    start_service: /atlas/navigation/start
    cancel_service: /atlas/navigation/cancel

    map_frame: map
    odom_frame: odom
    base_frame: base_link
    control_rate_hz: 50.0
    odom_timeout_s: 0.80
    default_waypoint_timeout_s: 30.0

    startup_localization:
      warmup_s: 1.0
      candidate_timeout_s: 30.0
      sample_count: 20
      min_map_scan_agreement: 0.35
      min_map_scan_hits: 25
      # Do not freeze map->odom until Cartographer has connected the new
      # localization trajectory to the frozen trajectory loaded from pbstream.
      constraint_topic: /constraint_list
      require_global_constraint: true
      min_global_constraints: 1
      post_constraint_settle_s: 0.8
      max_origin_offset_m: 1000.0
      max_origin_yaw_rad: 3.141593
      stability_xy_m: 0.030
      stability_yaw_rad: 0.040

    # 开局完成严格全局匹配后保持 Cartographer 运行，用激光持续修正轮式
    # 里程计累计漂移。校正有速率限制和跳变门禁，不会把位姿图瞬时跳变
    # 直接变成底盘速度突变。
    continuous_localization:
      enabled: true
      tf_timeout_s: 0.50
      max_correction_speed_m_s: 0.30
      max_correction_yaw_rate_rad_s: 0.60
      max_tf_jump_m: 0.50
      max_tf_jump_yaw_rad: 0.70

    control:
      kp_xy: 1.80
      kp_yaw: 2.20
      max_linear_speed_m_s: 1.00
      # 与 MCU 遥控器底盘中速档一致：1.0 m/s, 4.0 rad/s
      max_angular_speed_rad_s: 4.00
      max_linear_accel_m_s2: 2.00
      max_angular_accel_rad_s2: 8.00
      slowdown_distance_m: 0.20
      position_tolerance_m: 0.025
      yaw_tolerance_rad: 0.060
      require_yaw_reached: true
      brake_hold_s: 0.20
