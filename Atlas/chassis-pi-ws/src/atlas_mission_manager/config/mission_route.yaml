# 自动任务路线配置
# 本文件由 atlas_mission_manager 读取
# 这里统一描述地图点位，点位顺序，预识别动作名称，到点任务名称和返航策略
# 本文件只写点位和动作引用，不写具体关节角，不写伪导航控制参数
# 具体关节角放在 atlas_vision_pollination_backend/config/pollination_actions.yaml
# 伪导航控制参数放在 atlas_nav_pseudo_backend/config/pseudo_nav.yaml
# 点位坐标均为任务相对坐标，任务启动后第一个点会以当前 /odom 作为原点

mission:
  # 坐标模式
  # task_relative 表示 x，y，yaw 都相对于本轮自动任务开始时的 /odom
  coordinate_mode: "task_relative"

  # 导航后端名称
  # 当前实现 pseudo，后续可新增完整导航后端并在这里切换
  navigation_backend: "pseudo"

  # 到点后任务后端名称
  # 当前实现 vision_pollination，负责视觉识别，手眼变换和授粉动作序列
  manipulation_backend: "vision_pollination"

  # 前进路线最大执行点数
  # 1 表示只执行第一个点，用于首次安全联调
  # 2 表示执行前两个点，用于验证从过渡点到第一个作业点的方向
  # 0 表示不限制，执行 waypoints 中所有点
  max_forward_waypoints: 1

  # 是否执行 return_waypoints
  # 首次实车测试建议保持 false
  # 前进路线稳定后再改为 true
  return_home_enabled: false

  # 前进路线点列表
  # id 是当前 ROS2 任务流使用的点位名，需要全局唯一
  # x，y，yaw 是任务相对坐标，单位分别是 m，m，rad
  # area 是区域标签，只用于日志和后续调试
  # timeout_s 是该点伪导航最大允许时间
  # prepare_action 是该点的预识别位姿名称，会在 pollination_actions.yaml 中查找
  # arrival_task 是到点后任务名称，noop 表示只到点不执行视觉和机械臂
  # PASS_BY 点一般使用 noop
  # AREA_A，AREA_B，AREA_C 点默认使用 visual_pollination
  waypoints:
    # 前进点 1
    # 区域 PASS_BY
    # 该点只用于底盘移动或过渡，不执行视觉授粉
    - id: "pass_01"
      x: 0.00
      y: -0.07
      yaw: 0.00
      area: "PASS_BY"
      timeout_s: 20.00
      prepare_action: "noop"
      arrival_task: "noop"

    # 前进点 2
    # 区域 AREA_A
    # 该点到位后执行视觉授粉任务
    - id: "area_a_02_down"
      x: 0.71
      y: -0.08
      yaw: 0.00
      area: "AREA_A"
      timeout_s: 20.00
      prepare_action: "pre_detect_nav_02"
      arrival_task: "visual_pollination"

    # 前进点 3
    # 区域 AREA_A
    # 该点到位后执行视觉授粉任务
    - id: "area_a_03_up_mid"
      x: 0.71
