# 视觉授粉动作配置
# 本文件由 atlas_vision_pollination_backend 读取
# mission_route.yaml 中的 prepare_action 和 arrival_task 都会引用这里的名称
# 所有关节角单位都是 rad
# 每次实车调参建议只改一个点位或一个动作，避免无法判断问题来源

