# 视觉授粉动作配置
# 本文件由 atlas_vision_pollination_backend 读取
# mission_route.yaml 中的 prepare_action 和 arrival_task 都会引用这里的名称
# prepare_actions 用于配置各个点的预识别关节位姿
# arrival_tasks 用于配置到点后的视觉授粉任务
# 所有关节角单位都是 rad
# 工具点偏移单位都是 m
# 每次实车调参建议只改一个点位或一个动作，便于定位问题

prepare_actions:
