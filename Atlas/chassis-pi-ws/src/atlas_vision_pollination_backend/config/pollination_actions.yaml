arrival_tasks:
  # 空到位任务
  # 用于 PASS_BY 点或纯导航调试点
  noop:
    type: "noop"

  # 默认完整视觉授粉任务
  # 该任务会先执行当前 waypoint 的 prepare_action
  # 然后调用 /vision/detect_camera_target 获取相机坐标目标
  # 再用手眼变换和工具点偏移计算预授粉与授粉位置
  visual_pollination:
    type: "visual_pollination"

    # 没有目标时的策略
    # skip 表示跳过该点并返回成功
    # fail 表示该点任务失败，并由总任务状态机上报 FAIL
    empty_target_policy: "skip"

    # 视觉服务名
    # 由 atlas_camera_target_service 提供
    vision_service: "/vision/detect_camera_target"

    # 预授粉工具点偏移，单位 m
    # 工具点偏移写在 tool0 坐标系下
    # z=0.097 是当前 hand_eye_ok.py 中验证可行的预授粉高度
    pre_pollination_tool_point_m: [0.05, -0.015, 0.097]

    # 授粉工具点偏移，单位 m
    # z 越小，末端越靠近目标
    # 如果接触过深就增大 z，如果接触不到就减小 z
    pollination_tool_point_m: [0.05, -0.015, 0.087]

    # 默认动作速度，单位 rad/s
    speed_rad_s: 1.0

    # 单个机械臂动作等待到位超时时间，单位 s
    timeout_s: 8.0

    # 授粉位姿停留时间，单位 s
    dwell_pollination_s: 0.3

    # 视觉授粉动作序列
    # ensure_prepare_pose 会执行当前 waypoint 的 prepare_action
    # 第一个 visual_position 会在预识别位姿下触发视觉服务，并把目标转换到 arm_base_link
    # 后续 visual_position 使用同一个目标 base 坐标和检测时刻的工具坐标方向
    # 这样可以避免机械臂移动后重复使用旧相机坐标导致误差
    sequence:
      - type: "ensure_prepare_pose"
        name: "到达预识别位姿"

      - type: "visual_position"
        name: "到达预授粉位姿"
        tool_point_ref: "pre_pollination_tool_point_m"

      - type: "visual_position"
        name: "到达授粉位姿"
        tool_point_ref: "pollination_tool_point_m"

      - type: "dwell"
        name: "授粉停留"
        duration_s: 0.3

      - type: "visual_position"
        name: "回到预授粉位姿"
        tool_point_ref: "pre_pollination_tool_point_m"

      - type: "joints_action"
        name: "回到预识别位姿"
        action_ref: "prepare_action"

  # 旧 MCU 纯关节授粉序列
  # 这些任务默认不被 mission_route.yaml 使用
  # 如果要让某个点使用旧纯关节序列，将该点 arrival_task 改成对应 legacy_pollination_nav_XX
  # 这些序列不调用视觉服务，只按 joints_action 依次执行
  # nav_index 2 的旧 MCU 授粉序列
  legacy_pollination_nav_02:
    type: "joint_sequence"
    sequence:
      - type: "joints_action"
        name: "legacy_nav_02_step_01"
        action_ref: "legacy_nav_02_step_01"
      - type: "joints_action"
